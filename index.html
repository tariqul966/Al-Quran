<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al Quran</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .player-container {
            width: 100%;
            max-width: 600px;
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 1.5rem;
            color: var(--accent);
            margin-bottom: 6px;
        }

        .controls-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        select {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            background-color: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--border);
            outline: none;
            font-size: 0.95rem;
            cursor: pointer;
        }

        select:focus {
            border-color: var(--accent);
        }

        .now-playing {
            background-color: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--accent);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            margin-bottom: 20px;
        }

        .now-playing-title {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 4px;
        }

        .now-playing-reciter {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        audio {
            width: 100%;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        .playlist {
            max-height: 250px;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        .playlist-item {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s;
            direction: rtl;
        }

        .playlist-item:last-child {
            border-bottom: none;
        }

        .playlist-item:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        .playlist-item.active {
            background-color: rgba(16, 185, 129, 0.2);
            color: var(--accent);
            font-weight: bold;
        }

        .status-msg {
            font-size: 0.85rem;
            margin-top: 6px;
            text-align: center;
            color: var(--text-muted);
        }

        .playlist::-webkit-scrollbar {
            width: 6px;
        }
        .playlist::-webkit-scrollbar-track {
            background: var(--card-bg);
        }
        .playlist::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="player-container">
    <div class="header">
        <h1>Al Quran</h1>
        <p style="font-size: 0.85rem; color: var(--text-muted);">Stream Recitations</p>
    </div>

    <div class="controls-group">
        <label for="reciterSelect">Select Reciter :</label>
        <select id="reciterSelect">
            <option value="">Loading playlist...</option>
        </select>
        <div id="statusMsg" class="status-msg">Fetching data from GitHub...</div>
    </div>

    <div class="now-playing">
        <div class="now-playing-title" id="currentTrackTitle">Select a track</div>
        <div class="now-playing-reciter" id="currentTrackReciter">-</div>
    </div>

    <audio id="audioPlayer" controls autoplay></audio>

    <div class="controls-group">
        <label>Playlist:</label>
        <div class="playlist" id="playlistContainer"></div>
    </div>
</div>

<script>
    // -------------------------------------------------------------
    // এখানে আপনার GitHub Raw M3U ফাইলটির লিঙ্ক বসিয়ে দিন:
    // -------------------------------------------------------------
   // const GITHUB_M3U_URL = "https://raw.githubusercontent.com/nimda95/quran-iptv/master/quranicaudio.m3u8";
	const GITHUB_M3U_URL = "https://raw.githubusercontent.com/tariqul966/Al-Quran/refs/heads/main/al%20quran.m3u8";

    let tracks = [];
    let reciters = [];
    let currentFilteredTracks = [];
    let currentTrackIndex = 0;

    const audioPlayer = document.getElementById('audioPlayer');
    const reciterSelect = document.getElementById('reciterSelect');
    const playlistContainer = document.getElementById('playlistContainer');
    const currentTrackTitle = document.getElementById('currentTrackTitle');
    const currentTrackReciter = document.getElementById('currentTrackReciter');
    const statusMsg = document.getElementById('statusMsg');

    // M3U ফাইল পার্স করা
    function parseM3U(m3uContent) {
        const lines = m3uContent.split('\n');
        const parsedTracks = [];
        let currentItem = {};

        lines.forEach(line => {
            line = line.trim();
            if (line.startsWith('#EXTINF:')) {
                const groupMatch = line.match(/group-title="([^"]+)"/);
                const titleMatch = line.split(',');
                
                currentItem.reciter = groupMatch ? groupMatch[1] : 'Unknown Reciter';
                currentItem.title = titleMatch.length > 1 ? titleMatch[titleMatch.length - 1].trim() : 'Unknown Track';
            } else if (line.startsWith('http')) {
                currentItem.url = line;
                parsedTracks.push({ ...currentItem });
                currentItem = {};
            }
        });

        return parsedTracks;
    }

    // GitHub URL ফর্মেটিং (যদি সাধারণ GitHub লিঙ্ক দেওয়া হয়)
    function formatGitHubUrl(url) {
        if (url.includes('github.com') && !url.includes('raw.githubusercontent.com')) {
            return url.replace('github.com', 'raw.githubusercontent.com').replace('/blob/', '/');
        }
        return url;
    }

    // GitHub থেকে প্লেলিস্ট লোড করা
    async function loadPlaylist() {
        const rawUrl = formatGitHubUrl(GITHUB_M3U_URL.trim());

        try {
            const response = await fetch(rawUrl);
            if (!response.ok) throw new Error('Failed to fetch file');
            
            const content = await response.text();
            tracks = parseM3U(content);

            if (tracks.length === 0) {
                statusMsg.textContent = 'No valid tracks found in the M3U file.';
                statusMsg.style.color = '#ef4444';
                return;
            }

            reciters = [...new Set(tracks.map(track => track.reciter))];
            reciterSelect.innerHTML = reciters.map(r => `<option value="${r}">${r}</option>`).join('');

            statusMsg.textContent = ''; // লোড সফল হলে স্ট্যাটাস মেসেজ লুকিয়ে দেওয়া হবে

            if (reciters.length > 0) {
                filterAndDisplayPlaylist(reciters[0]);
            }
        } catch (err) {
            statusMsg.textContent = 'Error loading playlist. Check the GitHub URL and CORS settings.';
            statusMsg.style.color = '#ef4444';
        }
    }

    // নির্বাচিত কারীর গান/সুরা ফিল্টার করা
    function filterAndDisplayPlaylist(reciterName) {
        currentFilteredTracks = tracks.filter(t => t.reciter === reciterName);
        renderPlaylist();
        if (currentFilteredTracks.length > 0) {
            playTrack(0, false);
        }
    }

    // প্লেলিস্ট রেন্ডার করা
    function renderPlaylist() {
        playlistContainer.innerHTML = '';
        currentFilteredTracks.forEach((track, index) => {
            const item = document.createElement('div');
            item.className = `playlist-item ${index === currentTrackIndex ? 'active' : ''}`;
            item.innerHTML = `<span>${track.title}</span>`;
            item.addEventListener('click', () => playTrack(index, true));
            playlistContainer.appendChild(item);
        });
    }

    // গান প্লে করা
    function playTrack(index, shouldPlay = true) {
        currentTrackIndex = index;
        const track = currentFilteredTracks[index];

        if (!track) return;

        audioPlayer.src = track.url;
        currentTrackTitle.textContent = track.title;
        currentTrackReciter.textContent = track.reciter;

        const items = playlistContainer.querySelectorAll('.playlist-item');
        items.forEach((item, i) => {
            if (i === index) {
                item.classList.add('active');
                item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            } else {
                item.classList.remove('active');
            }
        });

        if (shouldPlay) {
            audioPlayer.play();
        }
    }

    // ইভেন্ট লিসেনার
    reciterSelect.addEventListener('change', (e) => {
        filterAndDisplayPlaylist(e.target.value);
    });

    audioPlayer.addEventListener('ended', () => {
        if (currentTrackIndex < currentFilteredTracks.length - 1) {
            playTrack(currentTrackIndex + 1);
        }
    });

    // পেজ লোড হলেই প্লেলিস্ট ফেচ করবে
    loadPlaylist();
</script>
</body>
</html>
